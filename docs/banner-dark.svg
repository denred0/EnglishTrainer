<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Тетрадь — тренажёр перевода с русского на английский">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3e4e63" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#141821"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <path d="M132 0V360" stroke="#c3656f" stroke-width="2"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#2f3640"/>

  <text x="168" y="112" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#e5e8ed" letter-spacing="-1">Тетрадь</text>
  <text x="170" y="156" font-family="'Golos Text', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#a5abb5">Тренажёр перевода с русского на английский</text>

  <text x="170" y="234" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="34" fill="#e5e8ed">Я уже прочитал эту книгу.</text>
  <text x="170" y="296" font-family="Literata, Georgia, 'Times New Roman', serif" font-size="32" fill="#84a9f7">I <tspan fill="#f2716a" font-family="Caveat, 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="36" font-style="italic">have</tspan> already read this book.</text>
  <text x="1046" y="262" text-anchor="middle" font-family="Caveat, 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive" font-size="150" font-style="italic" fill="#65c67d">5</text>
  <path d="M990 290c38-6 78-7 116-3" fill="none" stroke="#65c67d" stroke-width="4" stroke-linecap="round"/>
  <path d="M74 282c5 3 9.5 8 13 15.5C93.5 282 102 270 116 261" fill="none" stroke="#65c67d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
