<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Тетрадь — перевод на английский</title>
    <script>
      // The theme before the first paint, so a dark page never flashes light: the one picked with the header
      // button (src/lib/theme.ts), otherwise the system's.
      (function () {
        var picked = null;
        try {
          picked = JSON.parse(localStorage.getItem('theme'));
        } catch (e) {}
        var dark = picked ? picked === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap"
      rel="stylesheet"
    />

    <div id="root"></div>

  </body>
</html>
